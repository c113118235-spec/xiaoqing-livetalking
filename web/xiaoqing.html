<title>小晴</title>
<!-- 小晴的 LiveTalking 前端：畫面用 WebRTC 即時串流，字幕來自 /sse 事件，文字用 /human 送出 -->
<style>
  :root {
    --glow: #F3A6D8; --accent: #E86AA6; --ink: #FFFFFF; --dim: rgba(255,255,255,.45);
    --glass: rgba(14,12,20,.55); --line: rgba(255,255,255,.18);
    --focus-x: 55%; --focus-y: 30%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0B0A10; color: var(--ink); overflow: hidden;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .stage { position: fixed; inset: 0; background: #0B0A10; }
  .stage video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: var(--focus-x) var(--focus-y);
    opacity: 0; transition: opacity .6s;
  }
  .stage video.on { opacity: 1; }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to right, rgba(0,0,0,.55) 0, rgba(0,0,0,.15) 45%, rgba(0,0,0,0) 65%),
      linear-gradient(to bottom, rgba(0,0,0,.35) 0, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 70%, rgba(0,0,0,.6) 100%);
  }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 15px; }

  .ui {
    position: fixed; inset: 0; display: flex; flex-direction: column; pointer-events: none;
    padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .ui > * { pointer-events: auto; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .ai-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: rgba(255,255,255,.7); }
  .status { flex: 1; font-size: 13px; color: rgba(255,255,255,.75); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .icon-btn {
    height: 36px; min-width: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--glass); color: var(--ink); font-size: 13px; cursor: pointer; font-family: inherit;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .icon-btn.on { border-color: var(--glow); color: var(--glow); }

  .captions { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: min(46vw, 620px); padding-bottom: 6vh; gap: 10px; }
  .you { font-size: 15px; color: rgba(255,255,255,.7); min-height: 22px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .you:not(:empty)::before { content: "你："; color: rgba(255,255,255,.5); }
  .line { display: flex; align-items: flex-start; gap: 14px; }
  .speaker { flex-shrink: 0; width: 34px; height: 34px; margin-top: 4px; display: flex; align-items: center; gap: 3px; opacity: .35; transition: opacity .2s; }
  .speaker i { display: block; width: 4px; border-radius: 2px; background: var(--glow); }
  .speaker i:nth-child(1) { height: 40%; } .speaker i:nth-child(2) { height: 75%; } .speaker i:nth-child(3) { height: 100%; } .speaker i:nth-child(4) { height: 60%; }
  .talking .speaker { opacity: 1; filter: drop-shadow(0 0 6px var(--glow)); }
  .talking .speaker i { animation: eq .5s ease-in-out infinite alternate; }
  .talking .speaker i:nth-child(2) { animation-delay: .12s; } .talking .speaker i:nth-child(3) { animation-delay: .24s; }
  @keyframes eq { from { transform: scaleY(.45); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .talking .speaker i { animation: none; } }
  .now {
    font-size: clamp(22px, 3.2vw, 40px); font-weight: 700; line-height: 1.35; min-height: 1.35em; word-break: break-word;
    text-shadow: 0 0 14px rgba(243,166,216,.75), 0 2px 8px rgba(0,0,0,.7);
  }
  .next {
    margin-top: 6px; font-size: clamp(18px, 2.5vw, 32px); font-weight: 700; line-height: 1.35; color: var(--dim);
    text-shadow: 0 2px 8px rgba(0,0,0,.6); word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .chip {
    padding: 10px 18px; border-radius: 20px; border: 1px solid var(--line); background: var(--glass);
    color: #FFF; font-size: 15px; cursor: pointer; font-family: inherit;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .chip:disabled { opacity: .45; cursor: default; }
  .chip[hidden] { display: none; }
  .chip.act { border-color: var(--glow); color: var(--glow); }
  /* 快捷按鈕可以收起來：只留下「快捷」開關 */
  .chip-toggle { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,.85); }
  .chip-toggle svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.4; fill: none; transition: transform .2s; }
  .chips.collapsed .chip-toggle svg { transform: rotate(-90deg); }
  .chips.collapsed .chip:not(.chip-toggle) { display: none; }
  .inputrow { display: flex; gap: 10px; max-width: 620px; width: 100%; }
  .inputrow input {
    flex: 1; min-width: 0; padding: 14px 18px; font-size: 16px; border-radius: 26px; font-family: inherit;
    border: 1px solid var(--line); background: var(--glass); color: #FFF;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .inputrow input::placeholder { color: rgba(255,255,255,.55); }
  .send {
    padding: 0 26px; border-radius: 26px; border: none; background: var(--accent); color: #FFF; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; box-shadow: 0 0 0 5px rgba(232,106,166,.22);
  }
  .send:disabled { opacity: .5; cursor: default; }
  .mic {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--glass); color: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); touch-action: none; user-select: none; -webkit-user-select: none;
    transition: transform .15s, background .15s;
  }
  .mic svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
  .mic.rec { background: var(--accent); border-color: var(--accent); transform: scale(1.12); box-shadow: 0 0 0 8px rgba(232,106,166,.3); }
  .mic.busy { opacity: .5; }
  .hint { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 8px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }

  .start {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 18vh; background: rgba(8,6,12,.45); cursor: pointer; border: none; width: 100%;
  }
  .start[hidden] { display: none; }
  .start span {
    padding: 18px 34px; border-radius: 32px; background: var(--accent); color: #FFF; font-size: 20px; font-weight: 700;
    box-shadow: 0 0 0 8px rgba(232,106,166,.25), 0 10px 40px rgba(0,0,0,.4); font-family: inherit;
  }

  @media (max-aspect-ratio: 1/1) {
    .captions { max-width: 100%; justify-content: flex-end; padding-bottom: 18px; }
    .stage::after { background: linear-gradient(to bottom, rgba(0,0,0,.35) 0, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  }
</style>
<style>
.persona-switch{display:inline-flex;gap:2px;margin-left:12px;padding:3px;border-radius:999px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);vertical-align:middle}
.persona-switch[hidden]{display:none}
.persona-switch button{border:0;background:transparent;color:#e6e6e6;font:inherit;font-size:14px;
  padding:4px 14px;border-radius:999px;cursor:pointer}
.persona-switch button.on{background:#e86aa6;color:#fff;font-weight:700}
.persona-switch button:disabled{opacity:.55;cursor:wait}
</style>
<script>
/* 經過 Cloudflare 公開網址時 SSE 串流會被卡住：改用長輪詢（/msgpoll）模擬 EventSource */
(function () {
  if (!/trycloudflare\.com$/.test(location.hostname) && !/[?&]poll=1\b/.test(location.search)) return;
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  class PollSource {
    constructor(url) {
      const m = String(url).match(/sessionid=([^&]+)/);
      this.url = url; this.sid = m ? m[1] : ""; this.readyState = 0;
      this.onmessage = this.onerror = this.onopen = null; this._l = {}; this._closed = false;
      setTimeout(() => this._loop(), 0);
    }
    addEventListener(t, f) { (this._l[t] = this._l[t] || []).push(f); }
    removeEventListener(t, f) { this._l[t] = (this._l[t] || []).filter(x => x !== f); }
    _emit(t, ev) { const h = this["on" + t]; if (h) h.call(this, ev); for (const f of (this._l[t] || [])) f.call(this, ev); }
    close() { this._closed = true; this.readyState = 2; }
    async _loop() {
      while (!this._closed) {
        try {
          const r = await fetch("msgpoll?sessionid=" + this.sid + "&t=" + Date.now(), { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();
          if (this._closed) break;
          if (this.readyState !== 1) { this.readyState = 1; this._emit("open", new Event("open")); }
          for (const msg of (d.msgs || [])) this._emit("message", new MessageEvent("message", { data: msg }));
        } catch (e) {
          if (this._closed) break;
          this._emit("error", new Event("error"));
          await wait(2000);
        }
      }
    }
  }
  PollSource.CONNECTING = 0; PollSource.OPEN = 1; PollSource.CLOSED = 2;
  window.EventSource = PollSource;
})();
</script>

<div class="stage">
  <div class="loading" id="loading">連線中…</div>
  <video id="video" autoplay playsinline></video>
  <audio id="audio" autoplay></audio>
</div>

<div class="picker" id="start" role="dialog" aria-label="選擇學伴">
  <div class="pick-panel" id="pickPanel">
    <h2>想跟誰聊？</h2>
    <p class="pick-sub">選一位，點一下就開始（瀏覽器需要你點一下才能播放聲音）</p>
    <div class="pick-grid" id="pickGrid">
      <button type="button" class="pick-card" id="pickDefault"><span class="pick-face">晴</span><b>小晴</b><small>預設角色<br>可切換女友／學伴</small></button>
      <button type="button" class="pick-card" id="pickAdd"><span class="pick-face add">＋</span><b>用照片建立學伴</b><small>需要本人同意<br>製作約幾分鐘</small></button>
    </div>
  </div>

<script>
// 網址參數：?mode=chat 讓 LLM 回答（要先設定好 LLM）；預設 echo = 她照念你打的字
const params = new URLSearchParams(location.search);
const MODE = params.get("mode") === "chat" ? "chat" : "echo";
const $ = (id) => document.getElementById(id);
let pc = null, sessionid = null, es = null, interrupt = true;
const queue = [];     // 還沒念的句子（字幕預告用）

function setStatus(s) { $("status").textContent = s; }
function showNext() { $("next").textContent = queue.join(""); }

// ---------- 播放緩衝（buffer）與畫質統計 ----------
// ?buffer=300 → 瀏覽器先緩衝 300 ms 再播：晚到或要重傳的封包來得及補上，畫面較少破圖／降畫質，代價是延遲多 300 ms
// ?stats=1   → 左下角顯示解析度、碼率、掉包、重傳、緩衝時間，用來比較加 buffer 前後
const BUFFER_MS = Math.max(0, Math.min(4000, parseInt(params.get("buffer") || "0", 10) || 0));
const SHOW_STATS = params.get("stats") === "1";

function setBuffer(receiver) {
  if (!BUFFER_MS || !receiver) return;
  try {
    if ("jitterBufferTarget" in receiver) receiver.jitterBufferTarget = BUFFER_MS;   // Chrome 114+，單位 ms
    else receiver.playoutDelayHint = BUFFER_MS / 1000;                               // 舊版 Chrome，單位秒
  } catch (e) { console.warn("buffer 設定失敗", e); }
}

function startStats(receiver) {
  const box = document.createElement("pre");
  box.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:9;margin:0;padding:10px 12px;border-radius:10px;" +
    "background:rgba(0,0,0,.65);color:#9FE1CB;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;pointer-events:none;white-space:pre";
  document.body.appendChild(box);
  let last = null;
  setInterval(async () => {
    const rep = await receiver.getStats();
    let v = null, codec = "";
    rep.forEach((s) => { if (s.type === "inbound-rtp" && s.kind === "video") v = s; });
    if (!v) return;
    const c = v.codecId && rep.get(v.codecId); if (c) codec = c.mimeType.replace("video/", "");
    const kbps = last ? ((v.bytesReceived - last.bytesReceived) * 8 / ((v.timestamp - last.timestamp) / 1000) / 1000) : 0;
    const jb = v.jitterBufferEmittedCount ? (v.jitterBufferDelay / v.jitterBufferEmittedCount * 1000) : 0;
    const qp = v.framesDecoded && v.qpSum != null ? (v.qpSum / v.framesDecoded) : null;
    box.textContent =
      `buffer 設定  ${BUFFER_MS} ms\n` +
      `實際緩衝    ${jb.toFixed(0)} ms\n` +
      `格式        ${codec}  ${v.frameWidth || "?"}×${v.frameHeight || "?"}  ${(v.framesPerSecond || 0).toFixed(0)} fps\n` +
      `碼率        ${kbps.toFixed(0)} kbps\n` +
      `QP（越低越清楚） ${qp == null ? "-" : qp.toFixed(1)}\n` +
      `掉包 ${v.packetsLost || 0}   重傳要求 ${v.nackCount || 0}\n` +
      `掉格 ${v.framesDropped || 0}   卡頓 ${v.freezeCount || 0} 次`;
    last = v;
  }, 1000);
}

// ---------- WebRTC：跟 LiveTalking 官方網頁一樣的連線方式 ----------
async function connect() {
  // STUN/TURN 清單向伺服器拿（設定了 Cloudflare TURN，校外沒有 VPN 也看得到影像）
  let iceServers = [{ urls: ["stun:stun.l.google.com:19302"] }];
  try {
    const r = await fetch("iceservers");
    if (r.status === 401) { location.href = "gate"; return; }
    if (r.ok) iceServers = (await r.json()).iceServers || iceServers;
  } catch (e) {}
  pc = new RTCPeerConnection({ sdpSemantics: "unified-plan", iceServers });
  pc.addEventListener("track", (e) => {
    setBuffer(e.receiver);
    if (e.track.kind === "video") {
      if (SHOW_STATS) startStats(e.receiver);
      $("video").srcObject = e.streams[0];
      $("video").onplaying = () => { $("video").classList.add("on"); $("loading").remove(); };
    } else {
      $("audio").srcObject = e.streams[0];
    }
  });
  pc.addEventListener("connectionstatechange", () => {
    if (pc.connectionState === "failed" || pc.connectionState === "disconnected")
      setStatus("連線中斷，請重新整理");
  });
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") return resolve();
    const check = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", check); resolve(); } };
    pc.addEventListener("icegatheringstatechange", check);
    setTimeout(resolve, 5000);   // 最多等 5 秒（TURN 要多一點時間）
  });
  const r = await fetch("offer", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type,
                           avatar: window.XQ_CUSTOM ? window.XQ_CUSTOM.id : undefined }),   // 自訂學伴
  });
  const answer = await r.json();
  sessionid = answer.sessionid;
  await pc.setRemoteDescription(answer);
  listen();
  initActions();
}

// ---------- 動作按鈕（伺服器有設定 data/actions/poses.json 才會出現） ----------
async function initActions() {
  if (window.XQ_CUSTOM) return;          // 動作影片是照小晴做的，自訂學伴不顯示
  try {
    const r = await fetch("pose/actions");
    if (!r.ok) return;
    const acts = (await r.json()).actions || {};
    document.querySelectorAll("[data-act]").forEach((b) => {
      if (!acts[b.dataset.act]) return;
      b.hidden = false;
      b.onclick = () => doAction(b.dataset.act);
    });
  } catch (e) {}
}
async function doAction(act) {
  if (!sessionid) return;
  try {
    const r = await fetch("pose", { method: "POST", headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ sessionid, action: act }) });
    const j = await r.json();
    if (!j.ok) setStatus(j.msg || "現在不能做這個動作");
  } catch (e) { setStatus("動作送出失敗"); }
}

// ---------- 字幕：她開始念某一句（start）／念完（end） ----------
function listen() {
  es = new EventSource(`sse?sessionid=${encodeURIComponent(sessionid)}`);
  es.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.status === "start") {
      if (d.text) {
        const i = queue.indexOf(d.text);
        if (i >= 0) queue.splice(0, i + 1);
        $("now").textContent = d.text;
      }
      showNext();
      $("ui").classList.add("talking");
      setStatus("");
    } else if (d.status === "end") {
      if (!queue.length) $("ui").classList.remove("talking");
    }
  };
}

// ---------- 送出文字 ----------
async function say(text) {
  text = (text || "").trim();
  if (!text || !sessionid) return;
  $("you").textContent = text;
  if (interrupt) queue.length = 0;            // 打斷：之前排隊的句子都不念了
  if (MODE === "echo") queue.push(text); else setStatus("思考中…");
  showNext();
  try {
    await fetch("human", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionid, text, type: MODE, interrupt }),
    });
  } catch (e) { setStatus("送出失敗"); }
}

$("send").onclick = () => { say($("text").value); $("text").value = ""; };
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) $("send").click(); });
document.querySelectorAll("[data-say]").forEach((b) => b.onclick = () => say(b.dataset.say));
$("intr").onclick = () => { interrupt = !interrupt; $("intr").classList.toggle("on", interrupt); $("intr").textContent = interrupt ? "可打斷" : "不打斷"; };
$("stop").onclick = () => {
  if (!sessionid) return;
  queue.length = 0; showNext();
  fetch("interrupt_talk", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionid }) });
};

// ---------- 語音輸入：點一下或按住錄音 → /asr 轉文字 → 跟打字一樣送出 ----------
// 麥克風只能在 https 或 localhost 用；http://192.168.x.x 會被瀏覽器擋掉
// 兩種用法：點一下 → 開始錄，講完停頓約 1 秒自動送出（或再點一下送出）；按住 → 放開就送出
let rec = null, chunks = [], recStart = 0, stream = null;
let recording = false, starting = false, pressAt = 0, tapMode = false, cancelled = false;
let vad = null;                                   // 偵測講完了沒（音量）
const HOLD_MS = 350;                              // 按超過這麼久才算「按住」
const SILENCE_MS = 1100, NO_SPEECH_MS = 7000, MAX_MS = 30000;
const canMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
if (!canMic) {
  $("mic").classList.add("busy");
  $("hint").textContent = "這個網址不能用麥克風：請用 http://localhost:8010（SSH 轉接）或 https 開啟";
}

function startVad() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC(), src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let noise = 0.01, spoke = false, lastVoice = performance.now(), frames = 0;
    const timer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (const v of buf) sum += v * v;
      const rms = Math.sqrt(sum / buf.length), now = performance.now();
      if (frames++ < 8) { noise = Math.max(noise, rms); return; }        // 前 0.4 秒量背景音
      if (rms > Math.max(0.02, noise * 2.5)) { spoke = true; lastVoice = now; }
      if (!tapMode) return;                                               // 按住模式由放開決定
      if (spoke && now - lastVoice > SILENCE_MS) stopRec();               // 講完了
      else if (!spoke && now - recStart > NO_SPEECH_MS) { cancelled = true; stopRec(); setStatus("沒聽到聲音，再點一下麥克風試試"); }
    }, 50);
    vad = { stop() { clearInterval(timer); try { ctx.close(); } catch (e) {} }, spoke: () => spoke };
  } catch (e) { vad = null; }
}

async function startRec() {
  if (!canMic || recording || starting || !sessionid || $("mic").classList.contains("busy")) return;
  starting = true;
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) { starting = false; setStatus("沒有麥克風權限"); return; }
  starting = false;
  if (interrupt) $("stop").click();             // 你一開口，她就先停下來聽
  const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
  chunks = []; cancelled = false;
  rec = new MediaRecorder(stream, type ? { mimeType: type } : {});
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = sendVoice;
  rec.start();
  recording = true; recStart = performance.now();
  $("mic").classList.add("rec");
  setStatus(tapMode ? "聽你說…（說完停一下就會送出）" : "聽你說…（放開就送出）");
  startVad();
  const thisRec = rec;
  setTimeout(() => { if (recording && rec === thisRec) stopRec(); }, MAX_MS);   // 最長 30 秒
}

function stopRec() {
  if (!recording) return;
  recording = false; tapMode = false;
  $("mic").classList.remove("rec");
  if (vad) { rec._spoke = vad.spoke(); vad.stop(); vad = null; }
  if (rec && rec.state !== "inactive") rec.stop();
}

// 按下：沒在錄就開始錄；點一下模式錄音中再按一下就送出
async function pressDown() {
  if (recording && tapMode) { stopRec(); return; }
  if (recording) return;
  pressAt = performance.now(); tapMode = false;
  await startRec();
}
// 放開：按得夠久 → 按住模式，送出；很快放開 → 點一下模式，繼續錄
function pressUp() {
  if (!pressAt) return;
  const held = performance.now() - pressAt;
  pressAt = 0;
  if (!recording && !starting) return;
  if (held >= HOLD_MS) stopRec();
  else { tapMode = true; setStatus("聽你說…（說完停一下就會送出，或再點一下）"); }
}

async function sendVoice() {
  if (cancelled) { cancelled = false; return; }
  const ms = performance.now() - recStart;
  const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
  if (ms < 300 || blob.size < 800) { setStatus("太短了，再說一次？"); return; }   // 自己按停的就交給語音辨識判斷
  $("mic").classList.add("busy");
  setStatus("聽懂中…");
  try {
    const fd = new FormData();
    fd.append("file", blob, blob.type.includes("mp4") ? "voice.m4a" : "voice.webm");
    const r = await fetch("asr", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    if (!j.text) { setStatus("沒聽清楚，再說一次？"); return; }
    await say(j.text);
  } catch (e) {
    setStatus("語音辨識失敗：" + e.message);
  } finally {
    $("mic").classList.remove("busy");
  }
}

$("mic").addEventListener("pointerdown", (e) => { e.preventDefault(); $("mic").setPointerCapture(e.pointerId); pressDown(); });
$("mic").addEventListener("pointerup", pressUp);
$("mic").addEventListener("pointercancel", pressUp);
$("mic").addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && document.activeElement !== $("text")) { e.preventDefault(); pressDown(); }
});
document.addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement !== $("text")) { e.preventDefault(); pressUp(); } });

// 瀏覽器規定要使用者點一下才能自動播放聲音，所以連線放在這個按鈕
// （開始畫面在下方「選擇學伴」的程式裡：選好人物才連線）
window.addEventListener("beforeunload", () => { try { es && es.close(); pc && pc.close(); } catch (e) {} });
</script>
<script>
/* 人設切換：女友｜學伴（清單來自 data/personas.json） */
(function () {
  const box = document.getElementById("persona");
  let def = null, current = null, appliedSid = null, busy = false;
  const boardOf = {};   // 哪些人設有黑板
  let customOnly = false;   // 自訂學伴只能當學伴
  const forceStudy = () => {
    const pid = Object.keys(boardOf).find((k) => boardOf[k]);
    if (pid) { current = pid; mark(); }
    box.hidden = true;
  };
  window.addEventListener("xq-avatar", (e) => { customOnly = !!e.detail; if (customOnly) forceStudy(); });
  const mark = () => {
    for (const b of box.children) b.classList.toggle("on", b.dataset.id === current);
    window.dispatchEvent(new CustomEvent("xq-persona", { detail: { id: current, board: !!boardOf[current] } }));
  };
  const lock = (on) => { busy = on; for (const b of box.children) b.disabled = on; };
  async function send(id) {
    const r = await fetch("persona", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ sessionid, persona: id }) });
    return (await r.json()).ok;
  }
  async function choose(id) {
    if (busy || id === current) return;
    if (!sessionid) { current = id; mark(); return; }   // 還沒連線：先記住，連上後自動套用
    lock(true);
    try { if (await send(id)) { current = id; appliedSid = sessionid; mark(); } }
    catch (e) { console.warn("persona", e); }
    lock(false);
  }
  // 連線（或重新連線）後，伺服器是預設人設；如果使用者選的不是預設，就自動補送
  setInterval(async () => {
    if (!sessionid || sessionid === appliedSid || busy) return;
    appliedSid = sessionid;
    if (current && current !== def) { lock(true); try { await send(current); } catch (e) {} lock(false); }
  }, 1000);
  fetch("persona/list").then(r => r.json()).then(d => {
    def = current = d.default;
    for (const p of d.personas) {
      boardOf[p.id] = !!p.board;
      const b = document.createElement("button");
      b.type = "button"; b.textContent = p.label; b.dataset.id = p.id;
      b.onclick = () => choose(p.id);
      box.appendChild(b);
    }
    mark();
    box.hidden = d.personas.length < 2;
    if (customOnly) forceStudy();
  }).catch(() => { box.hidden = true; });
})();
</script>
<script>
/* 學伴黑板：學伴模式才出現；內容存在這台裝置的瀏覽器，變動時同步到伺服器（/board），
   學伴會在切換時、之後每 30 分鐘提醒快到期的作業（/board/say），打勾完成時稱讚你 */
(function () {
  const KEY = "xq_board_v1", OPEN_KEY = "xq_board_open";
  const AUTO_EVERY = 30 * 60 * 1000;        // 自動提醒間隔
  const AFTER_GREET = 9000;                 // 切到學伴後，等她打完招呼再提醒
  const $b = (id) => document.getElementById(id);
  const board = $b("board"), btn = $b("boardBtn");
  const narrow = () => matchMedia("(max-aspect-ratio: 1/1), (max-width: 760px)").matches;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let data = load(), isStudy = false, open = store.get(OPEN_KEY) !== "0";
  let syncedSid = null, remindedSid = null, lastAuto = 0;

  function load() {
    try {
      const d = JSON.parse(store.get(KEY));
      if (d && Array.isArray(d.tasks)) return { goal: String(d.goal || ""), tasks: d.tasks };
    } catch (e) {}
    return { goal: "", tasks: [] };
  }
  function save() { store.set(KEY, JSON.stringify(data)); }

  // ---------- 日期 ----------
  const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
  function daysLeft(due) {
    if (!due) return null;
    const d = new Date(due + "T00:00:00");
    return isNaN(d) ? null : Math.round((d - today()) / 86400000);
  }
  function dueLabel(due) {
    const n = daysLeft(due);
    if (n === null) return null;
    const d = new Date(due + "T00:00:00"), md = `${d.getMonth() + 1}/${d.getDate()}`;
    if (n < 0) return { t: `逾期 ${-n} 天`, c: "over" };
    if (n === 0) return { t: "今天", c: "today" };
    if (n === 1) return { t: "明天", c: "soon" };
    if (n === 2) return { t: "後天", c: "soon" };
    return { t: md, c: "" };
  }

  // ---------- 畫面 ----------
  function render() {
    const t = new Date();
    $b("boardDate").textContent = `${t.getMonth() + 1}/${t.getDate()} 星期${"日一二三四五六"[t.getDay()]}`;
    if (document.activeElement !== $b("boardGoal")) $b("boardGoal").value = data.goal;
    const done = data.tasks.filter((x) => x.done).length, all = data.tasks.length;
    $b("boardProg").textContent = all ? `完成 ${done} / ${all}` : "還沒有作業";
    $b("boardBar").style.width = all ? `${Math.round(done / all * 100)}%` : "0";

    const list = $b("boardList");
    list.textContent = "";
    if (!all) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "把作業、考試或今天想讀的進度寫在下面，學伴會幫你記著，快到期時提醒你。";
      list.appendChild(li);
      return;
    }
    const order = [...data.tasks].sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const da = daysLeft(a.due), db = daysLeft(b.due);
      if (da === null || db === null) return (da === null) - (db === null);
      return da - db;
    });
    for (const task of order) {
      const li = document.createElement("li");
      if (task.done) li.className = "done";
      const ck = document.createElement("button");
      ck.type = "button"; ck.className = "ck";
      ck.setAttribute("aria-label", task.done ? "標成未完成" : "標成完成");
      ck.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
      ck.onclick = () => toggle(task.id);
      const txt = document.createElement("span");
      txt.className = "txt"; txt.textContent = task.text;
      li.append(ck, txt);
      const lab = dueLabel(task.due);
      if (lab) {
        const due = document.createElement("span");
        due.className = "due " + lab.c; due.textContent = lab.t; due.title = "截止日 " + task.due;
        li.appendChild(due);
      }
      const del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "刪除");
      del.onclick = () => { data.tasks = data.tasks.filter((x) => x.id !== task.id); changed(); };
      li.appendChild(del);
      list.appendChild(li);
    }
  }

  function show() {
    const on = isStudy && open;
    board.hidden = !on;
    btn.hidden = !isStudy;
    btn.classList.toggle("on", on);
    document.body.classList.toggle("board-on", on && !narrow());
  }

  // ---------- 同步與學伴開口 ----------
  async function sync() {
    if (!sessionid) return;
    try {
      await fetch("board", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionid, goal: data.goal, tasks: data.tasks.map(({ text, due, done }) => ({ text, due, done })) }) });
      syncedSid = sessionid;
    } catch (e) { console.warn("board sync", e); }
  }
  async function say(event, extra) {
    if (!sessionid || !isStudy) return false;
    try {
      const r = await fetch("board/say", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionid, event, ...extra }) });
      return (await r.json()).ok;
    } catch (e) { return false; }
  }
  const talking = () => document.getElementById("ui").classList.contains("talking");

  let syncTimer = null;
  function changed() { save(); render(); clearTimeout(syncTimer); syncTimer = setTimeout(sync, 300); }

  async function toggle(id) {
    const task = data.tasks.find((x) => x.id === id);
    if (!task) return;
    task.done = !task.done;
    save(); render();
    clearTimeout(syncTimer);
    await sync();
    if (task.done) say("done", { text: task.text });
  }

  // ---------- 輸入 ----------
  $b("boardAdd").onsubmit = (e) => {
    e.preventDefault();
    const text = $b("boardText").value.trim();
    if (!text) { $b("boardText").focus(); return; }
    data.tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                      text: text.slice(0, 60), due: $b("boardDue").value || "", done: false });
    if (data.tasks.length > 30) data.tasks = data.tasks.slice(-30);
    $b("boardText").value = ""; $b("boardDue").value = "";
    changed();
  };
  $b("boardGoal").addEventListener("input", () => { data.goal = $b("boardGoal").value.slice(0, 80); save(); clearTimeout(syncTimer); syncTimer = setTimeout(sync, 800); });
  $b("boardGoal").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) e.target.blur(); });
  // 黑板裡打字時，空白鍵不要觸發「按住說話」
  board.addEventListener("keydown", (e) => e.stopPropagation());
  board.addEventListener("keyup", (e) => e.stopPropagation());
  $b("boardRemind").onclick = async () => {
    $b("boardRemind").disabled = true;
    await sync();
    await say("remind", { manual: true });
    setTimeout(() => { $b("boardRemind").disabled = false; }, 3000);
  };
  btn.onclick = () => { open = !open; store.set(OPEN_KEY, open ? "1" : "0"); show(); };

  // ---------- 跟著人設切換 ----------
  window.addEventListener("xq-persona", (e) => {
    const was = isStudy;
    isStudy = !!(e.detail && e.detail.board);
    if (isStudy && !was) { if (narrow()) open = false; remindedSid = null; }
    show();
  });
  matchMedia("(max-aspect-ratio: 1/1), (max-width: 760px)").addEventListener("change", show);

  // 每秒檢查：新的連線要先同步；剛切到學伴就排一次提醒；之後每 30 分鐘提醒一次
  setInterval(async () => {
    if (!sessionid) return;
    if (sessionid !== syncedSid) await sync();
    if (!isStudy) return;
    if (remindedSid !== sessionid) {
      remindedSid = sessionid;
      lastAuto = Date.now() - AUTO_EVERY + AFTER_GREET;   // 9 秒後提醒第一次
    }
    if (Date.now() - lastAuto >= AUTO_EVERY && !talking()) {
      lastAuto = Date.now();
      say("remind", { manual: false });
    }
  }, 1000);
  setInterval(render, 10 * 60 * 1000);   // 跨過午夜時更新「今天／明天」

  render(); show();
})();
</script>
<script>
/* 快捷按鈕收起／展開（記在這台裝置的瀏覽器） */
(function () {
  const box = document.getElementById("chips"), btn = document.getElementById("chipToggle");
  let open = false;
  try { open = localStorage.getItem("xq_chips_open") === "1"; } catch (e) {}
  const apply = () => { box.classList.toggle("collapsed", !open); btn.setAttribute("aria-expanded", String(open)); };
  btn.onclick = () => { open = !open; try { localStorage.setItem("xq_chips_open", open ? "1" : "0"); } catch (e) {} apply(); };
  apply();
})();
</script>
<script>
/* 選擇學伴：小晴，或用照片做的自訂學伴（清單只存在這台裝置的瀏覽器） */
(function () {
  const CKEY = "xq_custom_v1";
  const $p = (id) => document.getElementById(id);
  const store = {
    get() { try { const v = JSON.parse(localStorage.getItem(CKEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; } },
    set(v) { try { localStorage.setItem(CKEY, JSON.stringify(v)); } catch (e) {} },
  };
  let mine = store.get(), statusOf = {}, pollTimer = null;

  function begin(item) {
    window.XQ_CUSTOM = item || null;
    $p("start").hidden = true;
    if (item) {
      document.querySelector("header h1").textContent = item.name;
      document.querySelector("header .ai-tag").textContent = "AI 生成";
      document.title = item.name + "｜AI 學伴";
    }
    window.dispatchEvent(new CustomEvent("xq-avatar", { detail: item || null }));
    setStatus(MODE === "echo" ? "複讀模式：她會照念你打的字" : "");
    connect().catch((e) => setStatus("連不上伺服器：" + e.message));
  }

  function statusText(s) {
    if (!s) return "讀取中…";
    if (s.status === "ready") return s.mode === "static" ? "準備好了（靜態版）" : "準備好了";
    if (s.status === "queued") return "排隊中…";
    if (s.status === "animating") return "讓照片動起來…";
    if (s.status === "building") return `製作中 ${s.progress || 0}%`;
    if (s.status === "failed") return "失敗：" + (s.error || "請換一張照片");
    return "找不到了";
  }

  function render() {
    const grid = $p("pickGrid");
    grid.querySelectorAll(".custom").forEach((n) => n.remove());
    for (const item of mine) {
      const s = statusOf[item.id];
      const ready = s && s.status === "ready";
      const card = document.createElement("div");
      card.className = "pick-card custom" + (ready ? "" : " wait");
      card.tabIndex = ready ? 0 : -1;
      card.setAttribute("role", "button");
      const face = document.createElement("span");
      face.className = "pick-face";
      if (s && (ready || s.status === "building")) {
        const img = document.createElement("img");
        img.src = "custom/thumb?id=" + encodeURIComponent(item.id); img.alt = "";
        face.appendChild(img);
      } else face.textContent = (item.name || "?").slice(0, 1);
      const name = document.createElement("b"); name.textContent = item.name;
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "自訂學伴";
      const st = document.createElement("small"); st.textContent = statusText(s);
      card.append(face, name, tag, st);
      if (s && ["queued", "animating", "building"].includes(s.status)) {
        const bar = document.createElement("div"); bar.className = "bar";
        const i = document.createElement("i"); i.style.width = (s.progress || 2) + "%";
        bar.appendChild(i); card.appendChild(bar);
      }
      const del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.textContent = "×"; del.title = "刪除這位學伴";
      del.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm(`刪除「${item.name}」？照片和做好的學伴都會從伺服器刪掉。`)) return;
        try {
          const r = await fetch("custom/delete", { method: "POST", headers: { "Content-Type": "application/json" },
                                                    body: JSON.stringify({ id: item.id, key: item.key }) });
          const j = await r.json();
          if (!j.ok && r.status !== 404) { alert(j.msg || "刪除失敗"); return; }
        } catch (err) { alert("刪除失敗：" + err.message); return; }
        mine = mine.filter((x) => x.id !== item.id); store.set(mine); render();
      };
      card.appendChild(del);
      if (ready) {
        card.onclick = () => begin(item);
        card.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); begin(item); } };
      }
      grid.insertBefore(card, $p("pickAdd"));
    }
  }

  async function refresh() {
    let busy = false;
    await Promise.all(mine.map(async (item) => {
      try {
        const r = await fetch("custom/status?id=" + encodeURIComponent(item.id));
        const j = await r.json();
        if (r.status === 404) { statusOf[item.id] = { status: "missing" }; return; }
        statusOf[item.id] = j;
        if (["queued", "animating", "building"].includes(j.status)) busy = true;
      } catch (e) { busy = true; }
    }));
    mine = mine.filter((x) => !statusOf[x.id] || statusOf[x.id].status !== "missing");
    store.set(mine);
    render();
    clearTimeout(pollTimer);
    if (busy && !$p("start").hidden) pollTimer = setTimeout(refresh, 3000);
  }

  // ---------- 建立表單 ----------
  let file = null;
  const showForm = (on) => { $p("pickForm").hidden = !on; $p("pickPanel").hidden = on; $p("pickErr").textContent = ""; };
  $p("pickDefault").onclick = () => begin(null);
  $p("pickAdd").onclick = () => showForm(true);
  $p("pickCancel").onclick = () => showForm(false);
  $p("pickForm").addEventListener("change", () => { if ($p("pickErr").textContent !== "上傳中…") $p("pickErr").textContent = ""; });
  $p("pickFile").onchange = () => {
    file = $p("pickFile").files[0] || null;
    if (!file) return;
    if (file.size > 12 * 1024 * 1024) { $p("pickErr").textContent = "照片太大了（上限 12 MB）"; file = null; return; }
    const url = URL.createObjectURL(file);
    $p("pickPreview").src = url; $p("pickPreview").hidden = false; $p("pickDropText").hidden = true;
    $p("pickErr").textContent = "";
  };
  $p("pickForm").onsubmit = async (e) => {
    e.preventDefault();
    const name = $p("pickName").value.trim();
    if (!file) { $p("pickErr").textContent = "請先選一張照片"; return; }
    if (!name) { $p("pickErr").textContent = "請幫學伴取個名字"; $p("pickName").focus(); return; }
    if (!($p("pickC1").checked && $p("pickC2").checked && $p("pickC3").checked)) { $p("pickErr").textContent = "三個同意事項都要勾選"; return; }
    const fd = new FormData();
    fd.append("photo", file, file.name || "photo.jpg");
    fd.append("name", name);
    ["consent_self", "consent_adult", "consent_public"].forEach((k) => fd.append(k, "1"));
    $p("pickSubmit").disabled = true; $p("pickErr").textContent = "上傳中…";
    try {
      const r = await fetch("custom/create", { method: "POST", body: fd });
      const j = await r.json();
      if (!j.ok) throw new Error(j.msg || r.status);
      mine.push({ id: j.id, key: j.key, name: name.slice(0, 12) });
      store.set(mine);
      statusOf[j.id] = { status: "queued", progress: 0 };
      file = null; $p("pickForm").reset(); $p("pickPreview").hidden = true; $p("pickDropText").hidden = false;
      showForm(false); refresh();
    } catch (err) {
      $p("pickErr").textContent = "上傳失敗：" + err.message;
    } finally { $p("pickSubmit").disabled = false; }
  };
  render(); refresh();
})();
</script>
