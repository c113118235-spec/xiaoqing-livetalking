<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A10">
<title>小晴</title>
<!-- 小晴的 LiveTalking 前端：畫面用 WebRTC 即時串流，字幕來自 /sse 事件，文字用 /human 送出 -->
<style>
  :root {
    --glow: #F3A6D8; --accent: #E86AA6; --ink: #FFFFFF; --dim: rgba(255,255,255,.45);
    --glass: rgba(14,12,20,.55); --line: rgba(255,255,255,.18);
    --focus-x: 55%; --focus-y: 30%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0B0A10; color: var(--ink); overflow: hidden;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .stage { position: fixed; inset: 0; background: #0B0A10; }
  .stage video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: var(--focus-x) var(--focus-y);
    opacity: 0; transition: opacity .6s;
  }
  .stage video.on { opacity: 1; }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to right, rgba(0,0,0,.55) 0, rgba(0,0,0,.15) 45%, rgba(0,0,0,0) 65%),
      linear-gradient(to bottom, rgba(0,0,0,.35) 0, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 70%, rgba(0,0,0,.6) 100%);
  }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 15px; }

  .ui {
    position: fixed; inset: 0; display: flex; flex-direction: column; pointer-events: none;
    padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .ui > * { pointer-events: auto; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .ai-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: rgba(255,255,255,.7); }
  .status { flex: 1; font-size: 13px; color: rgba(255,255,255,.75); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .icon-btn {
    height: 36px; min-width: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--glass); color: var(--ink); font-size: 13px; cursor: pointer; font-family: inherit;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .icon-btn.on { border-color: var(--glow); color: var(--glow); }

  .captions { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: min(46vw, 620px); padding-bottom: 6vh; gap: 10px; }
  .you { font-size: 15px; color: rgba(255,255,255,.7); min-height: 22px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .you:not(:empty)::before { content: "你："; color: rgba(255,255,255,.5); }
  .line { display: flex; align-items: flex-start; gap: 14px; }
  .speaker { flex-shrink: 0; width: 34px; height: 34px; margin-top: 4px; display: flex; align-items: center; gap: 3px; opacity: .35; transition: opacity .2s; }
  .speaker i { display: block; width: 4px; border-radius: 2px; background: var(--glow); }
  .speaker i:nth-child(1) { height: 40%; } .speaker i:nth-child(2) { height: 75%; } .speaker i:nth-child(3) { height: 100%; } .speaker i:nth-child(4) { height: 60%; }
  .talking .speaker { opacity: 1; filter: drop-shadow(0 0 6px var(--glow)); }
  .talking .speaker i { animation: eq .5s ease-in-out infinite alternate; }
  .talking .speaker i:nth-child(2) { animation-delay: .12s; } .talking .speaker i:nth-child(3) { animation-delay: .24s; }
  @keyframes eq { from { transform: scaleY(.45); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .talking .speaker i { animation: none; } }
  .now {
    font-size: clamp(22px, 3.2vw, 40px); font-weight: 700; line-height: 1.35; min-height: 1.35em; word-break: break-word;
    text-shadow: 0 0 14px rgba(243,166,216,.75), 0 2px 8px rgba(0,0,0,.7);
  }
  .next {
    margin-top: 6px; font-size: clamp(18px, 2.5vw, 32px); font-weight: 700; line-height: 1.35; color: var(--dim);
    text-shadow: 0 2px 8px rgba(0,0,0,.6); word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .chip {
    padding: 10px 18px; border-radius: 20px; border: 1px solid var(--line); background: var(--glass);
    color: #FFF; font-size: 15px; cursor: pointer; font-family: inherit;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .chip:disabled { opacity: .45; cursor: default; }
  .inputrow { display: flex; gap: 10px; max-width: 620px; width: 100%; }
  .inputrow input {
    flex: 1; min-width: 0; padding: 14px 18px; font-size: 16px; border-radius: 26px; font-family: inherit;
    border: 1px solid var(--line); background: var(--glass); color: #FFF;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .inputrow input::placeholder { color: rgba(255,255,255,.55); }
  .send {
    padding: 0 26px; border-radius: 26px; border: none; background: var(--accent); color: #FFF; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; box-shadow: 0 0 0 5px rgba(232,106,166,.22);
  }
  .send:disabled { opacity: .5; cursor: default; }
  .mic {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--glass); color: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); touch-action: none; user-select: none; -webkit-user-select: none;
    transition: transform .15s, background .15s;
  }
  .mic svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
  .mic.rec { background: var(--accent); border-color: var(--accent); transform: scale(1.12); box-shadow: 0 0 0 8px rgba(232,106,166,.3); }
  .mic.busy { opacity: .5; }
  .hint { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 8px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }

  .start {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 18vh; background: rgba(8,6,12,.45); cursor: pointer; border: none; width: 100%;
  }
  .start[hidden] { display: none; }
  .start span {
    padding: 18px 34px; border-radius: 32px; background: var(--accent); color: #FFF; font-size: 20px; font-weight: 700;
    box-shadow: 0 0 0 8px rgba(232,106,166,.25), 0 10px 40px rgba(0,0,0,.4); font-family: inherit;
  }

  @media (max-aspect-ratio: 1/1) {
    .captions { max-width: 100%; justify-content: flex-end; padding-bottom: 18px; }
    .stage::after { background: linear-gradient(to bottom, rgba(0,0,0,.35) 0, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="loading" id="loading">連線中…</div>
  <video id="video" autoplay playsinline></video>
  <audio id="audio" autoplay></audio>
</div>

<button class="start" id="start"><span>點一下，開始跟小晴聊天</span></button>

<div class="ui" id="ui">
  <header>
    <h1>小晴</h1>
    <span class="ai-tag">AI 角色</span>
    <span class="status" id="status"></span>
    <button class="icon-btn on" id="intr" title="她說話時送出新的一句，會先打斷她">可打斷</button>
    <button class="icon-btn" id="stop" title="讓她停下來">停</button>
  </header>

  <div class="captions">
    <div class="you" id="you"></div>
    <div class="line">
      <div class="speaker" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div>
        <div class="now" id="now"></div>
        <div class="next" id="next"></div>
      </div>
    </div>
  </div>

  <div class="chips">
    <button class="chip" data-say="說個笑話給我聽">說個笑話</button>
    <button class="chip" data-say="今天過得怎麼樣？">今天過得好嗎</button>
    <button class="chip" data-say="陪我聊聊天好不好">陪我聊天</button>
  </div>
  <div class="inputrow">
    <button class="mic" id="mic" title="按住說話（電腦也可以按住空白鍵）" aria-label="按住說話">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <input id="text" placeholder="輸入想說的話…" autocomplete="off">
    <button class="send" id="send">送出</button>
  </div>
  <div class="hint" id="hint">按住麥克風說話，放開就送出（電腦可按住空白鍵）</div>
</div>

<script>
// 網址參數：?mode=chat 讓 LLM 回答（要先設定好 LLM）；預設 echo = 她照念你打的字
const params = new URLSearchParams(location.search);
const MODE = params.get("mode") === "chat" ? "chat" : "echo";
const $ = (id) => document.getElementById(id);
let pc = null, sessionid = null, es = null, interrupt = true;
const queue = [];     // 還沒念的句子（字幕預告用）

function setStatus(s) { $("status").textContent = s; }
function showNext() { $("next").textContent = queue.join(""); }

// ---------- 播放緩衝（buffer）與畫質統計 ----------
// ?buffer=300 → 瀏覽器先緩衝 300 ms 再播：晚到或要重傳的封包來得及補上，畫面較少破圖／降畫質，代價是延遲多 300 ms
// ?stats=1   → 左下角顯示解析度、碼率、掉包、重傳、緩衝時間，用來比較加 buffer 前後
const BUFFER_MS = Math.max(0, Math.min(4000, parseInt(params.get("buffer") || "0", 10) || 0));
const SHOW_STATS = params.get("stats") === "1";

function setBuffer(receiver) {
  if (!BUFFER_MS || !receiver) return;
  try {
    if ("jitterBufferTarget" in receiver) receiver.jitterBufferTarget = BUFFER_MS;   // Chrome 114+，單位 ms
    else receiver.playoutDelayHint = BUFFER_MS / 1000;                               // 舊版 Chrome，單位秒
  } catch (e) { console.warn("buffer 設定失敗", e); }
}

function startStats(receiver) {
  const box = document.createElement("pre");
  box.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:9;margin:0;padding:10px 12px;border-radius:10px;" +
    "background:rgba(0,0,0,.65);color:#9FE1CB;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;pointer-events:none;white-space:pre";
  document.body.appendChild(box);
  let last = null;
  setInterval(async () => {
    const rep = await receiver.getStats();
    let v = null, codec = "";
    rep.forEach((s) => { if (s.type === "inbound-rtp" && s.kind === "video") v = s; });
    if (!v) return;
    const c = v.codecId && rep.get(v.codecId); if (c) codec = c.mimeType.replace("video/", "");
    const kbps = last ? ((v.bytesReceived - last.bytesReceived) * 8 / ((v.timestamp - last.timestamp) / 1000) / 1000) : 0;
    const jb = v.jitterBufferEmittedCount ? (v.jitterBufferDelay / v.jitterBufferEmittedCount * 1000) : 0;
    const qp = v.framesDecoded && v.qpSum != null ? (v.qpSum / v.framesDecoded) : null;
    box.textContent =
      `buffer 設定  ${BUFFER_MS} ms\n` +
      `實際緩衝    ${jb.toFixed(0)} ms\n` +
      `格式        ${codec}  ${v.frameWidth || "?"}×${v.frameHeight || "?"}  ${(v.framesPerSecond || 0).toFixed(0)} fps\n` +
      `碼率        ${kbps.toFixed(0)} kbps\n` +
      `QP（越低越清楚） ${qp == null ? "-" : qp.toFixed(1)}\n` +
      `掉包 ${v.packetsLost || 0}   重傳要求 ${v.nackCount || 0}\n` +
      `掉格 ${v.framesDropped || 0}   卡頓 ${v.freezeCount || 0} 次`;
    last = v;
  }, 1000);
}

// ---------- WebRTC：跟 LiveTalking 官方網頁一樣的連線方式 ----------
async function connect() {
  // STUN/TURN 清單向伺服器拿（設定了 Cloudflare TURN，校外沒有 VPN 也看得到影像）
  let iceServers = [{ urls: ["stun:stun.l.google.com:19302"] }];
  try {
    const r = await fetch("iceservers");
    if (r.status === 401) { location.href = "gate"; return; }
    if (r.ok) iceServers = (await r.json()).iceServers || iceServers;
  } catch (e) {}
  pc = new RTCPeerConnection({ sdpSemantics: "unified-plan", iceServers });
  pc.addEventListener("track", (e) => {
    setBuffer(e.receiver);
    if (e.track.kind === "video") {
      if (SHOW_STATS) startStats(e.receiver);
      $("video").srcObject = e.streams[0];
      $("video").onplaying = () => { $("video").classList.add("on"); $("loading").remove(); };
    } else {
      $("audio").srcObject = e.streams[0];
    }
  });
  pc.addEventListener("connectionstatechange", () => {
    if (pc.connectionState === "failed" || pc.connectionState === "disconnected")
      setStatus("連線中斷，請重新整理");
  });
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") return resolve();
    const check = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", check); resolve(); } };
    pc.addEventListener("icegatheringstatechange", check);
    setTimeout(resolve, 5000);   // 最多等 5 秒（TURN 要多一點時間）
  });
  const r = await fetch("offer", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
  });
  const answer = await r.json();
  sessionid = answer.sessionid;
  await pc.setRemoteDescription(answer);
  listen();
}

// ---------- 字幕：她開始念某一句（start）／念完（end） ----------
function listen() {
  es = new EventSource(`sse?sessionid=${encodeURIComponent(sessionid)}`);
  es.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.status === "start") {
      if (d.text) {
        const i = queue.indexOf(d.text);
        if (i >= 0) queue.splice(0, i + 1);
        $("now").textContent = d.text;
      }
      showNext();
      $("ui").classList.add("talking");
      setStatus("");
    } else if (d.status === "end") {
      if (!queue.length) $("ui").classList.remove("talking");
    }
  };
}

// ---------- 送出文字 ----------
async function say(text) {
  text = (text || "").trim();
  if (!text || !sessionid) return;
  $("you").textContent = text;
  if (interrupt) queue.length = 0;            // 打斷：之前排隊的句子都不念了
  if (MODE === "echo") queue.push(text); else setStatus("思考中…");
  showNext();
  try {
    await fetch("human", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionid, text, type: MODE, interrupt }),
    });
  } catch (e) { setStatus("送出失敗"); }
}

$("send").onclick = () => { say($("text").value); $("text").value = ""; };
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) $("send").click(); });
document.querySelectorAll("[data-say]").forEach((b) => b.onclick = () => say(b.dataset.say));
$("intr").onclick = () => { interrupt = !interrupt; $("intr").classList.toggle("on", interrupt); $("intr").textContent = interrupt ? "可打斷" : "不打斷"; };
$("stop").onclick = () => {
  if (!sessionid) return;
  queue.length = 0; showNext();
  fetch("interrupt_talk", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionid }) });
};

// ---------- 語音輸入：按住錄音 → /asr 轉文字 → 跟打字一樣送出 ----------
// 麥克風只能在 https 或 localhost 用；http://192.168.x.x 會被瀏覽器擋掉
let rec = null, chunks = [], recStart = 0, stream = null, holding = false;
const canMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
if (!canMic) {
  $("mic").classList.add("busy");
  $("hint").textContent = "這個網址不能用麥克風：請用 http://localhost:8010（SSH 轉接）或 https 開啟";
}

async function micDown() {
  if (!canMic || holding || !sessionid || $("mic").classList.contains("busy")) return;
  holding = true;
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) { holding = false; setStatus("沒有麥克風權限"); return; }
  if (!holding) return;                         // 還在要權限時就放開了
  if (interrupt) $("stop").click();             // 你一開口，她就先停下來聽
  const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
  chunks = [];
  rec = new MediaRecorder(stream, type ? { mimeType: type } : {});
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = sendVoice;
  rec.start();
  recStart = performance.now();
  $("mic").classList.add("rec");
  setStatus("聽你說…");
  setTimeout(() => holding && micUp(), 30000);  // 最長 30 秒
}

function micUp() {
  if (!holding) return;
  holding = false;
  $("mic").classList.remove("rec");
  if (rec && rec.state !== "inactive") rec.stop();
}

async function sendVoice() {
  const ms = performance.now() - recStart;
  const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
  if (ms < 400 || blob.size < 1000) { setStatus("太短了，按住久一點再說"); return; }
  $("mic").classList.add("busy");
  setStatus("聽懂中…");
  try {
    const fd = new FormData();
    fd.append("file", blob, blob.type.includes("mp4") ? "voice.m4a" : "voice.webm");
    const r = await fetch("asr", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    if (!j.text) { setStatus("沒聽清楚，再說一次？"); return; }
    await say(j.text);
  } catch (e) {
    setStatus("語音辨識失敗：" + e.message);
  } finally {
    $("mic").classList.remove("busy");
  }
}

$("mic").addEventListener("pointerdown", (e) => { e.preventDefault(); $("mic").setPointerCapture(e.pointerId); micDown(); });
$("mic").addEventListener("pointerup", micUp);
$("mic").addEventListener("pointercancel", micUp);
$("mic").addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && document.activeElement !== $("text")) { e.preventDefault(); micDown(); }
});
document.addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement !== $("text")) { e.preventDefault(); micUp(); } });

// 瀏覽器規定要使用者點一下才能自動播放聲音，所以連線放在這個按鈕
$("start").onclick = async () => {
  $("start").hidden = true;
  setStatus(MODE === "echo" ? "複讀模式：她會照念你打的字" : "");
  try { await connect(); }
  catch (e) { setStatus("連不上伺服器：" + e.message); }
};
window.addEventListener("beforeunload", () => { try { es && es.close(); pc && pc.close(); } catch (e) {} });
</script>
</body>
</html>
